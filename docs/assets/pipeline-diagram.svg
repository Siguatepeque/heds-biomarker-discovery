<svg viewBox="-20 -20 860 210" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Four step pipeline: fetch literature and tag entities with PubTator3, build a co-occurrence graph, run ABC-model discovery to find candidate genes, then validate candidates against STRING, GTEx, and ClinVar.">
  <style>
    .bg { fill: #ffffff; }
    .frame { stroke: #dcdfd8; }
    .step-box { fill: #f4f5f1; stroke: #dcdfd8; }
    .step-num { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; font-size: 20px; fill: #8c611f; }
    .node-label { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #14171b; }
    .node-sub { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #5b6058; }
    .arrow-line { stroke: #14171b; }
    .arrow-head { fill: #14171b; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b2025; }
      .frame { stroke: #2b3130; }
      .step-box { fill: #14171b; stroke: #2b3130; }
      .step-num { fill: #d9a75c; }
      .node-label { fill: #eceee9; }
      .node-sub { fill: #9aa39b; }
      .arrow-line { stroke: #eceee9; }
      .arrow-head { fill: #eceee9; }
    }
  </style>
  <rect x="-20" y="-20" width="860" height="210" rx="10" class="bg frame" stroke-width="1" />
  <defs>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-head" />
    </marker>
  </defs>
  <g>
    <rect x="10" y="40" width="170" height="70" rx="6" class="step-box" />
    <text x="95" y="65" text-anchor="middle" class="step-num">1</text>
    <text x="95" y="90" text-anchor="middle" class="node-label">Fetch</text>
    <text x="95" y="106" text-anchor="middle" class="node-sub">PubMed + PubTator3</text>
  </g>
  <line x1="180" y1="75" x2="222" y2="75" class="arrow-line" stroke-width="1.4" marker-end="url(#arrow-flow)" />
  <g>
    <rect x="225" y="40" width="170" height="70" rx="6" class="step-box" />
    <text x="310" y="65" text-anchor="middle" class="step-num">2</text>
    <text x="310" y="90" text-anchor="middle" class="node-label">Graph</text>
    <text x="310" y="106" text-anchor="middle" class="node-sub">co-occurrence + PMI</text>
  </g>
  <line x1="395" y1="75" x2="437" y2="75" class="arrow-line" stroke-width="1.4" marker-end="url(#arrow-flow)" />
  <g>
    <rect x="440" y="40" width="170" height="70" rx="6" class="step-box" />
    <text x="525" y="65" text-anchor="middle" class="step-num">3</text>
    <text x="525" y="90" text-anchor="middle" class="node-label">Discover</text>
    <text x="525" y="106" text-anchor="middle" class="node-sub">ABC-model ranking</text>
  </g>
  <line x1="610" y1="75" x2="652" y2="75" class="arrow-line" stroke-width="1.4" marker-end="url(#arrow-flow)" />
  <g>
    <rect x="655" y="40" width="155" height="70" rx="6" class="step-box" />
    <text x="732" y="65" text-anchor="middle" class="step-num">4</text>
    <text x="732" y="90" text-anchor="middle" class="node-label">Validate</text>
    <text x="732" y="106" text-anchor="middle" class="node-sub">STRING, GTEx, ClinVar</text>
  </g>
</svg>
